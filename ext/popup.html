<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      font-size: 13px;
      margin: 0;
      padding: 14px;
      width: 270px;
      background: #1c1c28;
      color: #ccc;
    }
    h3 {
      margin: 0 0 2px;
      font-size: 14px;
      color: #eee;
    }
    p.sub {
      margin: 0 0 12px;
      font-size: 11px;
      color: #666;
    }
    label {
      display: block;
      margin-top: 10px;
      margin-bottom: 3px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
    }
    input, select {
      width: 100%;
      padding: 5px 8px;
      background: #2a2a3d;
      border: 1px solid #3a3a55;
      border-radius: 4px;
      color: #eee;
      font-size: 13px;
      font-family: monospace;
    }
    input:focus, select:focus { outline: none; border-color: #9b9bc7; }
    select { font-family: system-ui, sans-serif; cursor: pointer; }
    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 7px;
      background: #9b9bc7;
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #7b7ba7; }
    button.stop-btn  { background: #5a8a5a; }
    button.stop-btn:hover  { background: #467046; }
    button.pause-btn { background: #7a6eaa; }
    button.pause-btn:hover { background: #5e5490; }
    button.discard-btn {
      background: transparent;
      color: #8a6a6a;
      border: 1px solid #4a3535;
      padding: 5px 7px;
      font-size: 11px;
    }
    button.discard-btn:hover { background: #3a2525; color: #d09898; }
    button.discard-btn.confirm {
      background: #c05555;
      border-color: #c05555;
      color: #fff;
    }
    button.discard-btn.confirm:hover { background: #a03a3a; }
.manual-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }
    .manual-row input[type="checkbox"] {
      width: auto;
      accent-color: #9b9bc7;
      cursor: pointer;
    }
    .manual-row label {
      margin: 0;
      font-size: 11px;
      text-transform: none;
      letter-spacing: normal;
      color: #666;
      cursor: pointer;
    }
    #timer-status.prompt {
      color: #9b9bc7;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    #status, #timer-status {
      margin-top: 8px;
      font-size: 11px;
      min-height: 14px;
      color: #8f8;
      text-align: center;
    }
    #status.err, #timer-status.err { color: #f88; }
    .hint {
      margin-top: 10px;
      font-size: 10px;
      color: #555;
      line-height: 1.5;
    }
    #timer-display {
      font-family: monospace;
      font-size: 38px;
      font-weight: bold;
      text-align: center;
      color: #eee;
      letter-spacing: 3px;
      margin: 6px 0 10px;
      user-select: none;
    }
    #timer-display.running { color: #a0d4a0; }
    #timer-display.paused  { color: #c8b85a; }
    hr {
      border: none;
      border-top: 1px solid #2a2a3d;
      margin: 14px 0;
    }
    details summary {
      cursor: pointer;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #666;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    details summary::before {
      content: "▶";
      font-size: 9px;
      transition: transform 0.15s;
    }
    details[open] summary::before { transform: rotate(90deg); }
    details summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body>
  <h3>Immersion Tracker</h3>

  <!-- Stopwatch -->
  <div id="timer-display">00:00:00</div>

  <label>Activity</label>
  <select id="activity-select"></select>

  <div class="manual-row">
    <input type="checkbox" id="manual-check">
    <label for="manual-check">Manual logging</label>
  </div>
  <div class="manual-row">
    <input type="checkbox" id="audio-detect-check">
    <label for="audio-detect-check">Audio detect</label>
  </div>

  <div class="btn-row">
    <button id="pause-btn" style="display:none" class="pause-btn">Pause</button>
    <button id="start-stop-btn">Start</button>
  </div>
  <div class="btn-row" id="discard-row" style="display:none">
    <button id="discard-btn" class="discard-btn">Discard</button>
  </div>
  <div id="timer-status"></div>

  <hr>

  <!-- Settings (collapsed by default) -->
  <details>
    <summary>Extension Settings</summary>

    <p class="sub" style="margin-top:10px;">Port and token from your tracker's Settings page.</p>

    <label>Port</label>
    <input id="port" type="number" placeholder="18463" min="1024" max="65535">

    <label>Token</label>
    <input id="token" type="text" placeholder="paste token here" autocomplete="off" spellcheck="false">

    <div class="btn-row">
      <button id="save">Save</button>
    </div>
    <div id="status"></div>

    <p class="hint">
      Also syncs automatically while you read on reader.ttsu.app.<br>
      Tracker must be running to receive data.
    </p>
  </details>

  <script src="popup.js"></script>
</body>
</html>
